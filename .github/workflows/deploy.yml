name: Production CI/CD Auto-Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # 1. Verification Job: Lint, Type Check & Build in GitHub Runner
  verify:
    name: Verify Build & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}

      - name: Verify TypeScript & Next.js Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-temporary-secret-key-32chars-min' }}
          NEXT_TELEMETRY_DISABLED: 1

  # 2. Deployment Job: Automated Deploy to Server via SSH
  deploy:
    name: Deploy to Production Server
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting automated deployment for IEEE SMC 2027..."
            cd ${{ secrets.DEPLOY_PATH || '/root/projects/ieee-smc-2027' }}

            # 1. Pull latest code from main
            echo "📥 Pulling latest git changes..."
            git pull origin main

            # 2. Install dependencies & Prisma Client
            echo "📦 Updating dependencies..."
            npm ci --prefer-offline || npm install

            echo "🗄️ Generating Prisma Client & applying database schema..."
            npx prisma generate
            npx prisma migrate deploy || true

            # 3. Build standalone Next.js bundle
            echo "🏗️ Building Next.js standalone bundle..."
            npm run build

            # 4. Zero-downtime PM2 reload
            echo "🔄 Reloading PM2 process..."
            pm2 reload ieee-smc-2027 --update-env || pm2 restart ieee-smc-2027
            pm2 save

            # 5. Local healthcheck
            echo "🔍 Verifying application health..."
            sleep 2
            curl -s -f http://127.0.0.1:3002/api/admin/pages > /dev/null && echo "✅ Application is live and healthy!" || echo "⚠️ Warning: healthcheck endpoint returned non-200"

            echo "🎉 Automated deployment completed successfully!"
