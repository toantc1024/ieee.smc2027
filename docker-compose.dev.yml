services:
  postgres:
    image: postgres:16-alpine
    container_name: ieee_smc_2027_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ieee_smc_2027
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - smc2027_dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ieee_smc_2027"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/silo:latest
    container_name: ieee_smc_2027_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_dev_data:/data
    networks:
      - smc2027_dev_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/silo:latest
    container_name: ieee_smc_2027_minio_init_dev
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - smc2027_dev_network
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/ieee-smc-2027;
      mc anonymous set download local/ieee-smc-2027/public;
      exit 0;
      "

  app-dev:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ieee_smc_2027_web_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      APP_ENV: development
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - smc2027_dev_network

networks:
  smc2027_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
  minio_dev_data:
