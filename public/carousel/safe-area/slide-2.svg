<?xml version="1.0" encoding="UTF-8"?>
<!-- Demo slide #2 — orange/red accent, content still inside mobile 1:1 safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1000" width="2400" height="1000"
     font-family="'Inter','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="grid2" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0L0 0 0 120" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="diag2" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#fafafa" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="2400" height="1000" fill="url(#bg2)"/>
  <rect width="2400" height="1000" fill="url(#grid2)"/>
  <path d="M0 0H2400V1000H0Z M700 0H1700V1000H700Z" fill="url(#diag2)" fill-rule="evenodd"/>

  <rect x="100" y="50" width="2200" height="900" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-dasharray="10 8"/>
  <rect x="400" y="50" width="1600" height="900" fill="none" stroke="#fde68a" stroke-opacity="0.55" stroke-dasharray="6 6"/>

  <rect x="700" y="0" width="1000" height="1000" fill="#fde68a" fill-opacity="0.06" stroke="#fde68a" stroke-width="4"/>

  <g transform="translate(1200,500)" text-anchor="middle" fill="#ffffff">
    <circle r="60" cx="0" cy="-230" fill="#fde68a"/>
    <text y="-215" font-size="54" font-weight="800" fill="#7c2d12">02</text>
    <text y="-110" font-size="34" font-weight="600" fill="#fde68a" letter-spacing="6">NGHIÊN CỨU KHOA HỌC</text>
    <text y="-30" font-size="90" font-weight="900">Kết nối tri thức</text>
    <text y="70" font-size="90" font-weight="900">thúc đẩy đổi mới</text>
    <text y="150" font-size="28" fill="#fed7aa">Toàn bộ bố cục nằm gọn trong vùng an toàn — không bị cắt ở mọi kích thước màn hình.</text>
    <g transform="translate(-160,210)">
      <rect width="320" height="72" rx="36" fill="#fde68a"/>
      <text x="160" y="47" font-size="26" font-weight="700" fill="#7c2d12">Xem dự án nghiên cứu</text>
    </g>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="2">
    <path d="M0 40 L40 40 M40 40 L40 0"/>
    <path d="M2400 40 L2360 40 M2360 40 L2360 0"/>
    <path d="M0 960 L40 960 M40 960 L40 1000"/>
    <path d="M2400 960 L2360 960 M2360 960 L2360 1000"/>
  </g>

  <g font-size="14" fill="#fed7aa">
    <text x="120" y="930">Desktop safe 2200×900</text>
    <text x="420" y="930" fill="#fde68a">Tablet safe 1600×900</text>
    <text x="1720" y="930" fill="#fde68a">Mobile 1:1 safe (critical content here)</text>
  </g>
</svg>
