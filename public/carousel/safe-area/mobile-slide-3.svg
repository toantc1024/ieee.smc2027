<?xml version="1.0" encoding="UTF-8"?>
<!-- Mobile slide #3 — 9:16 portrait, teal. Safe area 900×1340 (y=290..1630). Container 3:4. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"
     font-family="'Inter','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="mbg3" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="mgrid3" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0L0 0 0 120" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="mdiag3" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#mbg3)"/>
  <rect width="1080" height="1920" fill="url(#mgrid3)"/>

  <!-- Crop zones: 240px top/bottom (3:4 container on 9:16 image) -->
  <rect x="0" y="0" width="1080" height="240" fill="url(#mdiag3)" opacity="0.5"/>
  <rect x="0" y="1680" width="1080" height="240" fill="url(#mdiag3)" opacity="0.5"/>
  <line x1="0" y1="240" x2="1080" y2="240" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.5"/>
  <line x1="0" y1="1680" x2="1080" y2="1680" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.5"/>

  <!-- Visible area outline -->
  <rect x="0" y="240" width="1080" height="1440" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="10 8"/>
  <rect x="90" y="290" width="900" height="1340" fill="#5eead4" fill-opacity="0.06" stroke="#5eead4" stroke-width="3"/>

  <!-- Brand content -->
  <g text-anchor="middle" fill="#ffffff">
    <circle cx="540" cy="440" r="55" fill="#5eead4"/>
    <text x="540" y="458" font-size="48" font-weight="800" fill="#134e4a" text-anchor="middle">03</text>

    <text x="540" y="560" font-size="32" font-weight="600" fill="#99f6e4" letter-spacing="5">HỢP TÁC QUỐC TẾ</text>

    <text x="540" y="700" font-size="82" font-weight="900">Cơ hội học tập</text>
    <text x="540" y="800" font-size="82" font-weight="900">xuyên biên giới</text>

    <text x="540" y="920" font-size="26" fill="#ccfbf1">
      Safe-area contract: vùng an toàn trung tâm
    </text>
    <text x="540" y="960" font-size="26" fill="#ccfbf1">
      luôn được giữ nguyên — không crop nội dung.
    </text>

    <g transform="translate(380 1040)">
      <rect width="320" height="72" rx="36" fill="#5eead4"/>
      <text x="160" y="47" font-size="26" font-weight="700" fill="#134e4a" text-anchor="middle">Chương trình liên kết</text>
    </g>
  </g>

  <!-- Corner ticks -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2">
    <path d="M0 40 L40 40 M40 40 L40 0"/>
    <path d="M1080 40 L1040 40 M1040 40 L1040 0"/>
    <path d="M0 1880 L40 1880 M40 1880 L40 1920"/>
    <path d="M1080 1880 L1040 1880 M1040 1880 L1040 1920"/>
  </g>

  <g font-size="14" fill="#ccfbf1">
    <text x="90" y="1840">Full canvas 1080×1920</text>
    <text x="90" y="1860" fill="#5eead4">Mobile safe 900×1400 (critical content here)</text>
  </g>
</svg>
