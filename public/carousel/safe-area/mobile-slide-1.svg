<?xml version="1.0" encoding="UTF-8"?>
<!-- Mobile slide #1 — 9:16 portrait. Safe area 900×1340 (y=290..1630). Container 3:4, crop 240px T/B. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"
     font-family="'Inter','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="mbg1" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#0a3d62"/>
    </linearGradient>
    <pattern id="mgrid1" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0L0 0 0 120" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="mdiag1" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#ef4444" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#mbg1)"/>
  <rect width="1080" height="1920" fill="url(#mgrid1)"/>

  <!-- Crop zones: 240px top/bottom (3:4 container on 9:16 image) -->
  <rect x="0" y="0" width="1080" height="240" fill="url(#mdiag1)" opacity="0.6"/>
  <rect x="0" y="1680" width="1080" height="240" fill="url(#mdiag1)" opacity="0.6"/>
  <line x1="0" y1="240" x2="1080" y2="240" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="0" y1="1680" x2="1080" y2="1680" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Visible area outline (after crop) -->
  <rect x="0" y="240" width="1080" height="1440" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="10 8"/>
  <rect x="90" y="290" width="900" height="1340" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="3"/>

  <!-- Brand content inside mobile-safe zone -->
  <g text-anchor="middle" fill="#ffffff">
    <!-- Number badge -->
    <circle cx="540" cy="440" r="55" fill="#10b981"/>
    <text x="540" y="458" font-size="48" font-weight="800" fill="#0b1f3a" text-anchor="middle">01</text>

    <!-- Tag line -->
    <text x="540" y="560" font-size="32" font-weight="600" fill="#a7f3d0" letter-spacing="5">HCMUTE · TRANG CHỦ</text>

    <!-- Headline — stacked vertically -->
    <text x="540" y="700" font-size="82" font-weight="900">Đào tạo kỹ sư</text>
    <text x="540" y="800" font-size="82" font-weight="900">thế hệ mới</text>

    <!-- Subtitle -->
    <text x="540" y="920" font-size="26" fill="#cbd5e1">
      Nội dung quan trọng nằm trong vùng an toàn
    </text>
    <text x="540" y="960" font-size="26" fill="#cbd5e1">
      — hiển thị đầy đủ trên mọi thiết bị.
    </text>

    <!-- CTA button -->
    <g transform="translate(380 1040)">
      <rect width="320" height="72" rx="36" fill="#10b981"/>
      <text x="160" y="47" font-size="26" font-weight="700" fill="#0b1f3a" text-anchor="middle">Khám phá ngành học</text>
    </g>
  </g>

  <!-- Corner registration ticks -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2">
    <path d="M0 40 L40 40 M40 40 L40 0"/>
    <path d="M1080 40 L1040 40 M1040 40 L1040 0"/>
    <path d="M0 1880 L40 1880 M40 1880 L40 1920"/>
    <path d="M1080 1880 L1040 1880 M1040 1880 L1040 1920"/>
  </g>

  <!-- Legend -->
  <g font-size="14" fill="#cbd5e1">
    <text x="90" y="1840">Full canvas 1080×1920</text>
    <text x="90" y="1860" fill="#6ee7b7">Mobile safe 900×1400 (critical content here)</text>
  </g>
</svg>
