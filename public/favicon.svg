<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#256eff" />
      <stop offset="50%" stop-color="#115eff" />
      <stop offset="100%" stop-color="#0a43bd" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#115eff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2" />
  <circle cx="64" cy="64" r="50" fill="url(#centerGlow)" />

  <!-- Cybernetic Neural Network Geometry -->
  <g stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" stroke-linecap="round">
    <!-- Outer Hexagon-Decagon Links -->
    <line x1="64" y1="20" x2="94" y2="34" />
    <line x1="94" y1="34" x2="106" y2="64" />
    <line x1="106" y1="64" x2="94" y2="94" />
    <line x1="94" y1="94" x2="64" y2="108" />
    <line x1="64" y1="108" x2="34" y2="94" />
    <line x1="34" y1="94" x2="22" y2="64" />
    <line x1="22" y1="64" x2="34" y2="34" />
    <line x1="34" y1="34" x2="64" y2="20" />

    <!-- Inner Spokes to Focal Center -->
    <line x1="64" y1="20" x2="64" y2="38" stroke="url(#goldGrad)" stroke-width="1.6" />
    <line x1="64" y1="108" x2="64" y2="90" stroke="url(#goldGrad)" stroke-width="1.6" />
    <line x1="34" y1="34" x2="48" y2="48" stroke="rgba(255, 255, 255, 0.6)" />
    <line x1="94" y1="34" x2="80" y2="48" stroke="rgba(255, 255, 255, 0.6)" />
    <line x1="34" y1="94" x2="48" y2="80" stroke="rgba(255, 255, 255, 0.6)" />
    <line x1="94" y1="94" x2="80" y2="80" stroke="rgba(255, 255, 255, 0.6)" />
  </g>

  <!-- Glowing Nodes -->
  <circle cx="64" cy="20" r="4.5" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="64" cy="108" r="4.5" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="94" cy="34" r="3.5" fill="#ffffff" />
  <circle cx="106" cy="64" r="3.5" fill="url(#goldGrad)" />
  <circle cx="94" cy="94" r="3.5" fill="#ffffff" />
  <circle cx="34" cy="94" r="3.5" fill="url(#goldGrad)" />
  <circle cx="22" cy="64" r="3.5" fill="#ffffff" />
  <circle cx="34" cy="34" r="3.5" fill="url(#goldGrad)" />

  <!-- Center SMC Typography Badge -->
  <text 
    x="64" 
    y="71" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="23" 
    font-weight="900" 
    letter-spacing="1px"
  >SMC</text>

  <!-- Sub-label 2027 -->
  <text 
    x="64" 
    y="86" 
    text-anchor="middle" 
    fill="#fbbf24" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="10" 
    font-weight="800" 
    letter-spacing="1.5px"
  >2027</text>
</svg>
