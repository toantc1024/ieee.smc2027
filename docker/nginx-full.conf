# Full Production Nginx configuration with SSL for IEEE SMC 2027
# Handles Main Website (Port 3002) + MinIO S3 / CDN Storage (Port 9000)

# [1] HTTP Redirect to HTTPS (All IEEE SMC 2027 domains)
server {
    listen 80;
    listen [::]:80;
    server_name ieee-smc2027.org www.ieee-smc2027.org cdn.ieee-smc2027.org storage.ieee-smc2027.org;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# [2] Main Next.js Web Application (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ieee-smc2027.org www.ieee-smc2027.org;

    ssl_certificate /etc/letsencrypt/live/ieee-smc2027.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ieee-smc2027.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# [3] MinIO S3 Storage & Public CDN (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.ieee-smc2027.org storage.ieee-smc2027.org;

    ssl_certificate /etc/letsencrypt/live/ieee-smc2027.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ieee-smc2027.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
